[package]
name = "frosted-glass"
version = "0.1.0"
description = "Frosted glass on COSMIC, in a Tauri app"
edition = "2021"

[lib]
name = "frosted_glass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Asking the compositor to blur behind the window (ext-background-effect-v1),
# on the Wayland connection GTK already has.
gtk = "0.18"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-scanner = "0.31"
# The protocol code wayland-scanner generates uses it for flag enums.
bitflags = "2"
